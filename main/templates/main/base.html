{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %} {% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="{% static '/main/css/header.css'%}" />
    <link rel="stylesheet" href="{% static '/main/css/footer.css'%}" />
    <link rel="stylesheet" href="{% static '/main/css/main.css'%}" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header>
      <nav class="navbar navbar-dark navbar-expand-lg blue-area">
        <div class="container-fluid d-flex">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="collapse navbar-collapse justify-content-end"
            id="navbarSupportedContent"
          >
            <ul class="navbar-nav mb-2 mb-lg-0">
              <li class="nav-item">
                <div class="bookmark-container">
                  <a class="navbar-brand" href="#"
                    ><img
                      src="{%static '/main/images/icon.svg' %}"
                      class="navbar-image"
                      alt="icon"
                  /></a>
                </div>
              </li>
              <li class="nav-item">
                <div class="bookmark-container {% if active_page == 'homepage' %} active {% endif %}">
                  <a class="nav-link" aria-current="page" href="{% url 'homepage' %}">Главная</a>
                </div>
              </li>
              <li class="nav-item">
                <div class="bookmark-container {% if active_page == 'projects' %} active {% endif %}">
                  <a class="nav-link" aria-current="page" href="{% url 'projects' %}">Проекты</a>
                </div>
              </li>
              <li class="nav-item dropdown">
                <div class="bookmark-container {% if active_page == 'faq' %} active {% endif %}">
                  <a class="nav-link" aria-current="page" href="{% url 'faq' %}">FAQ</a>
                </div>
              </li>
              <li class="nav-item">
                <div class="bookmark-container {% if active_page == 'contact' %} active {% endif %}">
                  <a class="nav-link" aria-current="page" href="{% url 'contact'%}">Связь</a>
                </div>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main class="flex-grow-1">
      {% block content %}
      {% endblock %}
    </main>
    <footer class="bg-light mt-auto">
      <div class="red-area">
        <div class="container">
          <div class="row">
            <!-- Колонка 1: О нас -->
            <div class="col-md-4 mb-4">
              <h5>О нас</h5>
              <p>Компания оказывает юридические услуги с 2010 года.</p>
            </div>

            <!-- Колонка 2: Быстрые ссылки -->
            <div class="col-md-4 mb-4">
              <h5>Навигация</h5>
              <ul class="list-unstyled footer-nav-list">
                <li><a href="{% url 'homepage' %}" class="text-decoration-none">Главная</a></li>
                <li><a href="{% url 'projects' %}" class="text-decoration-none">Проекты</a></li>
                <li><a href="{% url 'faq' %}" class="text-decoration-none">FAQ</a></li>
                <li><a href="{% url 'contact' %}" class="text-decoration-none">Связь</a></li>
              </ul>
            </div>

            <!-- Колонка 3: Соцсети -->
            <div class="col-md-4 mb-4">
              <h5>Контакты</h5>
              <a href="#" class="me-2"><i class="bi bi-facebook"></i></a>
              <a href="#" class="me-2"><i class="bi bi-instagram"></i></a>
              <a href="#" class="me-2"><i class="bi bi-telegram"></i></a>
            </div>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
